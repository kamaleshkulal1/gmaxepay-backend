name: Gmaxepay Backend Deployments

on:
  push:
    branches: [dev, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  deploy_dev:
    name: Deploy to Dev VPS
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: SSH and deploy node app
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST || secrets.SSH_VPS_HOST }}
          username: ${{ secrets.EC2_USERNAME || secrets.SSH_VPS_USER || 'ec2-user' }}
          key: ${{ secrets.EC2_PEM_KEY || secrets.SSH_VPS_PEM_KEY }}
          port: 22
          script: |
            REPO_DIR="/home/${{ secrets.EC2_USERNAME }}/gmaxepay-backend"
            if [ ! -d "$REPO_DIR" ]; then
              REPO_DIR="gmaxepay-backend"
            fi
            cd "$REPO_DIR" || exit 1
            git pull origin dev
            npm install
            pm2 describe gmaxepay-backend > /dev/null 2>&1
            if [ $? -eq 0 ]; then
              pm2 restart gmaxepay-backend --update-env
            else
              pm2 start index.js --name gmaxepay-backend
            fi

  deploy-production:
    name: Deploy to Production EC2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📋 Get commit info
        id: commit
        run: |
          echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "time=$(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          {
            echo 'author<<EOF'
            echo '${{ github.event.head_commit.author.name }}'
            echo 'EOF'
          } >> $GITHUB_OUTPUT
          {
            echo 'sha<<EOF'
            echo '${{ github.sha }}'
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: 📢 Notify Slack - Prod Started
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "🚀 Production Deployment Started",
              "attachments": [{
                "color": "warning",
                "fields": [
                  {"title": "Branch", "value": "main", "short": true},
                  {"title": "Author", "value": "${{ steps.commit.outputs.author }}", "short": true},
                  {"title": "Commit", "value": "${{ steps.commit.outputs.sha }}", "short": true},
                  {"title": "Time", "value": "${{ steps.commit.outputs.time }}", "short": true}
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.PROD_AWS_REGION }}

      - name: 🚀 Deploy via SSM
        id: ssm_deploy
        run: |
          echo "📤 Sending SSM deploy command..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.PROD_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='["#!/bin/bash","set -e","echo === Running as: $(whoami) ===","echo === Switching to ec2-user for full deploy ===","runuser -l ec2-user -c \"set -e && cd /home/ec2-user/gmaxepay-backend && echo Step1: git safe dir && git config --global --add safe.directory /home/ec2-user/gmaxepay-backend && echo Step2: backup env && ([ -f .env ] && cp .env /home/ec2-user/.env.prod.bak && echo env backed up || echo no env found) && echo Step3: git fetch && git fetch origin main && echo Step4: git reset && git clean -fd && git reset --hard origin/main && echo Step5: restore env && ([ -f /home/ec2-user/.env.prod.bak ] && cp /home/ec2-user/.env.prod.bak .env && rm /home/ec2-user/.env.prod.bak && echo env restored || echo no backup found) && echo Step6: npm install && npm install --production && echo Step7: pm2 restart && (pm2 restart gmaxepay-backend || pm2 start index.js --name gmaxepay-backend --node-args=--max-old-space-size=4096) && pm2 save && echo === Deploy Done ===\""]' \
            --region "${{ secrets.PROD_AWS_REGION }}" \
            --query "Command.CommandId" \
            --output text)

          echo "📋 SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

          echo "⏳ Waiting for deploy to complete (polls every 5s)..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.PROD_EC2_INSTANCE_ID }}" \
            --region "${{ secrets.PROD_AWS_REGION }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.PROD_EC2_INSTANCE_ID }}" \
            --region "${{ secrets.PROD_AWS_REGION }}" \
            --query "Status" \
            --output text)

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.PROD_EC2_INSTANCE_ID }}" \
            --region "${{ secrets.PROD_AWS_REGION }}" \
            --query "StandardOutputContent" \
            --output text)

          ERROR=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.PROD_EC2_INSTANCE_ID }}" \
            --region "${{ secrets.PROD_AWS_REGION }}" \
            --query "StandardErrorContent" \
            --output text)

          echo "====== EC2 OUTPUT ======"
          echo "$OUTPUT"
          echo "====== EC2 ERRORS ======"
          echo "$ERROR"
          echo "====== FINAL STATUS: $STATUS ======"

          if [ "$STATUS" != "Success" ]; then
            echo "❌ Deployment failed: $STATUS"
            exit 1
          fi

          echo "✅ SSM Deploy successful!"

      - name: 🏥 Health Check via SSM
        run: |
          echo "⏳ Waiting 20s for app startup..."
          sleep 20

          HC_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.PROD_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='["#!/bin/bash","for i in 1 2 3 4 5; do","  echo Health check attempt $i...","  HTTP=$(curl -s -o /tmp/hc.txt -w \"%{http_code}\" http://localhost:8005/health)","  BODY=$(cat /tmp/hc.txt)","  echo HTTP Status: $HTTP","  echo Response: $BODY","  if [ \"$HTTP\" = \"200\" ]; then","    echo Health check PASSED!","    exit 0","  fi","  echo Failed. Waiting 10s...","  sleep 10","done","echo FAILED after 5 attempts","pm2 logs gmaxepay-backend --lines 20 --nostream","exit 1"]' \
            --region "${{ secrets.PROD_AWS_REGION }}" \
            --query "Command.CommandId" \
            --output text)

          echo "📋 HC Command ID: $HC_ID"

          echo "⏳ Waiting for health check to complete (polls every 5s)..."
          aws ssm wait command-executed \
            --command-id "$HC_ID" \
            --instance-id "${{ secrets.PROD_EC2_INSTANCE_ID }}" \
            --region "${{ secrets.PROD_AWS_REGION }}"

          HC_STATUS=$(aws ssm get-command-invocation \
            --command-id "$HC_ID" \
            --instance-id "${{ secrets.PROD_EC2_INSTANCE_ID }}" \
            --region "${{ secrets.PROD_AWS_REGION }}" \
            --query "Status" \
            --output text)

          HC_OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$HC_ID" \
            --instance-id "${{ secrets.PROD_EC2_INSTANCE_ID }}" \
            --region "${{ secrets.PROD_AWS_REGION }}" \
            --query "StandardOutputContent" \
            --output text)

          HC_ERROR=$(aws ssm get-command-invocation \
            --command-id "$HC_ID" \
            --instance-id "${{ secrets.PROD_EC2_INSTANCE_ID }}" \
            --region "${{ secrets.PROD_AWS_REGION }}" \
            --query "StandardErrorContent" \
            --output text)

          echo "====== HC OUTPUT ======"
          echo "$HC_OUTPUT"
          echo "====== HC ERRORS ======"
          echo "$HC_ERROR"
          echo "====== HC STATUS: $HC_STATUS ======"

          if [ "$HC_STATUS" != "Success" ]; then
            echo "❌ Health check failed!"
            exit 1
          fi

          echo "✅ Production health check passed!"

      - name: ✅ Notify Slack - Prod Success
        uses: 8398a7/action-slack@v3
        if: success()
        with:
          status: success
          custom_payload: |
            {
              "text": "🎉 Production Deployment Successful!",
              "attachments": [{
                "color": "good",
                "fields": [
                  {"title": "Branch", "value": "main", "short": true},
                  {"title": "Author", "value": "${{ steps.commit.outputs.author }}", "short": true},
                  {"title": "Commit", "value": "${{ steps.commit.outputs.sha }}", "short": true},
                  {"title": "Time", "value": "${{ steps.commit.outputs.time }}", "short": true}
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: ❌ Notify Slack - Prod Failed
        uses: 8398a7/action-slack@v3
        if: failure()
        with:
          status: failure
          custom_payload: |
            {
              "text": "🚨 Production Deployment Failed!",
              "attachments": [{
                "color": "danger",
                "fields": [
                  {"title": "Branch", "value": "main", "short": true},
                  {"title": "Author", "value": "${{ steps.commit.outputs.author }}", "short": true},
                  {"title": "Action", "value": "Check GitHub Actions logs immediately!", "short": false}
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}